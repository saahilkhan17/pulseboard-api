services:
  postgres:
    image: postgres:16
    container_name: pulseboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseboard_dev_password}
      POSTGRES_DB: pulseboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: pulseboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: pulseboard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-pulseboard_dev_password}@postgres:5432/pulseboard
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: "Pulseboard API"
      VERSION: "1.0.0"
      API_V1_PREFIX: "/v1"
      ENVIRONMENT: "production"
      DB_ECHO: "false"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "10"
      REDIS_STREAM_KEY: "pulseboard:events"
      REDIS_CONSUMER_GROUP: "pulseboard_workers"
      REDIS_CONSUMER_NAME: "worker-1"
      WORKER_BATCH_SIZE: "500"
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_COMPACTION_INTERVAL_SECONDS: "60"
      WORKER_RETENTION_INTERVAL_SECONDS: "3600"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pulseboard_dev_jwt_secret_change_me}
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      RATE_LIMIT_PER_MINUTE: "1000"
      RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build: .
    container_name: pulseboard-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-pulseboard_dev_password}@postgres:5432/pulseboard
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: "Pulseboard API"
      VERSION: "1.0.0"
      API_V1_PREFIX: "/v1"
      ENVIRONMENT: "production"
      DB_ECHO: "false"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "10"
      REDIS_STREAM_KEY: "pulseboard:events"
      REDIS_CONSUMER_GROUP: "pulseboard_workers"
      REDIS_CONSUMER_NAME: "worker-1"
      WORKER_BATCH_SIZE: "500"
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_COMPACTION_INTERVAL_SECONDS: "60"
      WORKER_RETENTION_INTERVAL_SECONDS: "3600"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pulseboard_dev_jwt_secret_change_me}
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      RATE_LIMIT_PER_MINUTE: "1000"
      RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
